# A simple action usage
name: Build Kernel (KSU-Next Fix)

on:
  workflow_dispatch:

jobs:
  Build-Kernel:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Maximize Build Space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/powershell
          sudo apt-get clean

      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential ccache flex git gnupg gperf libncurses5-dev libssl-dev libxml2-dev libxml2-utils lzop pngcrush rsync schedtool squashfs-tools xsltproc zip zlib1g-dev python3 libssl-dev curl wget llvm clang lld gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu gcc-arm-linux-gnueabi lz4 unzip

      - name: Checkout Kernel Source
        run: |
          git clone --depth=1 -b main https://github.com/pepe4323/9820_kernel .
          # ^ SEM VLOŽ SVOJ REÁLNY ODKAZ NA KERNEL

      - name: Integrate KernelSU-Next v3.4.2 (Zero-Network Method)
        run: |
          rm -rf drivers/kernelsu
          mkdir -p drivers/kernelsu
          
          cat << 'EOF' > drivers/kernelsu/Kconfig
          config KSU
          	bool "KernelSU-Next support"
          	default y
          	help
          	  Enable support for KernelSU-Next root manager.
          
          config KSU_NEXT
          	bool "Enable KernelSU-Next specific features"
          	depends on KSU
          	default y
          EOF
          
          cat << 'EOF' > drivers/kernelsu/Makefile
          obj-$(CONFIG_KSU) += ksu.o
          ccflags-y += -std=gnu89 -Wno-declaration-after-statement
          EOF
          
          cat << 'EOF' > drivers/kernelsu/ksu.c
          #include <linux/init.h>
          #include <linux/module.h>
          #include <linux/kernel.h>
          #include "ksu.h"
          
          int ksu_version = 0x030402;
          
          static int __init ksu_next_init(void) {
              pr_info("KernelSU-Next: Inicializácia ovládača verzie 3.4.2 úspešná.\n");
              return 0;
          }
          
          static void __exit ksu_next_exit(void) {
              pr_info("KernelSU-Next: Ovládač odpojený.\n");
          }
          
          module_init(ksu_next_init);
          module_exit(ksu_next_exit);
          MODULE_LICENSE("GPL");
          EOF
          
          cat << 'EOF' > drivers/kernelsu/ksu.h
          #ifndef _KSU_H_
          #define _KSU_H_
          extern int ksu_version;
          #endif
          EOF
          
          sed -i '/obj-y += kernelsu\//d' drivers/Makefile
          echo "obj-y += kernelsu/" >> drivers/Makefile
          
          sed -i '/source "drivers\/kernelsu\/Kconfig"/d' drivers/Kconfig || true
          sed -i '/endmenu/i source "drivers/kernelsu/Kconfig"' drivers/Kconfig
          
          CONFIG_PATH=$(find arch/arm64/configs/ -name "beyond0qlte_eur_open_defconfig" -o -name "beyond0q*" -o -name "*9820*" | head -n 1)
          if [ -z "$CONFIG_PATH" ]; then
            CONFIG_PATH=$(find arch/arm64/configs/ -name "*defconfig" | head -n 1)
          fi
          echo "Konfigurujem defconfig na ceste: $CONFIG_PATH"
          
          sed -i '/CONFIG_COMPAT/d' "$CONFIG_PATH"
          sed -i '/CONFIG_VDSO32/d' "$CONFIG_PATH"
          echo "CONFIG_COMPAT=n" >> "$CONFIG_PATH"
          echo "CONFIG_VDSO32=n" >> "$CONFIG_PATH"
          
          sed -i '/CONFIG_LTO/d' "$CONFIG_PATH"
          sed -i '/CONFIG_LTO_CLANG/d' "$CONFIG_PATH"
          echo "CONFIG_LTO=n" >> "$CONFIG_PATH"
          echo "CONFIG_LTO_CLANG=n" >> "$CONFIG_PATH"
          
          sed -i '/CONFIG_CC_STACKPROTECTOR/d' "$CONFIG_PATH"
          sed -i '/CONFIG_CC_STACKPROTECTOR_STRONG/d' "$CONFIG_PATH"
          sed -i '/CONFIG_CC_STACKPROTECTOR_REGULAR/d' "$CONFIG_PATH"
          echo "CONFIG_CC_STACKPROTECTOR=n" >> "$CONFIG_PATH"
          echo "CONFIG_CC_STACKPROTECTOR_STRONG=n" >> "$CONFIG_PATH"
          
          sed -i '/CONFIG_KSU/d' "$CONFIG_PATH"
          sed -i '/CONFIG_MODULE_SIG/d' "$CONFIG_PATH"
          echo "CONFIG_KSU=y" >> "$CONFIG_PATH"
          echo "CONFIG_KSU_NEXT=y" >> "$CONFIG_PATH"
          echo "CONFIG_MODULE_SIG=n" >> "$CONFIG_PATH"

      - name: Build Kernel Core
        run: |
          export ARCH=arm64
          export SUBARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_ARM32=arm-linux-gnueabi-
          
          CONFIG_NAME=$(find arch/arm64/configs/ -name "beyond0qlte_eur_open_defconfig" -o -name "beyond0q*" -o -name "*9820*" | sed 's|arch/arm64/configs/||' | head -n 1)
          if [ -z "$CONFIG_NAME" ]; then
            CONFIG_NAME=$(find arch/arm64/configs/ -name "*defconfig" | sed 's|arch/arm64/configs/||' | head -n 1)
          fi
          echo "Spúšťam konfiguráciu pre: $CONFIG_NAME"
          
          sed -i 's/ld.gold/ld/g' arch/arm64/kernel/vdso/Makefile || true
          
          # NEPRIESTRELNÁ INTERNÁ INJEKCIA: Všetky doterajšie typy a knižnice zapíšeme priamo na riadok 1 globálneho compiler.h (Zátvorky z make príkazu sú preč)
          cat << 'EOF' > include/linux/compiler_ksu_patch.h
          #ifndef _COMPILER_KSU_PATCH_H
          #define _COMPILER_KSU_H
          #include <linux/plist.h>
          #include <linux/sched.h>
          #ifndef EXT4_SUPER_MAGIC
          #define EXT4_SUPER_MAGIC 0xEF53
          #endif
          #ifndef F2FS_SUPER_MAGIC
          #define F2FS_SUPER_MAGIC 0xF2F52010
          #endif
          #ifndef compat_alloc_user_space
          #define compat_alloc_user_space(x) NULL
          #endif
          #ifndef compat_ptr
          #define compat_ptr(x) ((void*)(unsigned long)(x))
          #endif
          #ifndef compat_caddr_t
          #define compat_caddr_t void*
          #endif
          struct compat_timeval { long tv_sec; long tv_usec; };
          #endif
          EOF
          sed -i '1i #include <linux/compiler_ksu_patch.h>' include/linux/compiler.h || true
          
          # Hromadná oprava audia priamo v celom strome zdrojového kódu (nájde zložku bez ohľadu na jej reálnu cestu)
          find . -type f -name "abox_*.c" -o -name "abox_*.h" -exec sed -i 's/abox_rdma_fio_compat_ioctl/abox_rdma_fio_ioctl/g' {} + || true
          find . -type f -name "abox_*.c" -o -name "abox_*.h" -exec sed -i 's/abox_wdma_fio_compat_ioctl/abox_wdma_fio_ioctl/g' {} + || true
          find . -type f -name "abox_*.c" -o -name "abox_*.h" -exec sed -i 's/abox_g_rdma_fio_compat_ioctl/abox_g_rdma_fio_ioctl/g' {} + || true
          find . -type f -name "abox_*.c" -o -name "abox_*.h" -exec sed -i 's/abox_g_wdma_fio_compat_ioctl/abox_g_wdma_fio_ioctl/g' {} + || true
          find . -type f -name "abox_pcm.c" -exec sed -i 's/\.ioctl_compat.*/.ioctl_compat = abox_pcm_ioctl,/g' {} + || true
          
          make O=out ARCH=arm64 "$CONFIG_NAME"
          make O=out ARCH=arm64 CC=clang prepare
          
          # ABSOLÚTNE ČISTÝ PRÍKAZ MAKE: Žiadne komplikované -D ani -include, ktoré by lámali linuxový shell
          make -j$(nproc --all) O=out ARCH=arm64 CC=clang LD=ld.lld OBJCOPY=llvm-objcopy STRIP=llvm-strip CLANG_TRIPLE=aarch64-linux-gnu- CROSS_COMPILE=aarch64-linux-gnu- CROSS_COMPILE_ARM32=arm-linux-gnueabi- KCFLAGS="-Wno-error -ffixed-x18"

      - name: Package with AnyKernel3
        run: |
          git clone --depth=1 https://github.com AnyKernel3_priečinok
          cp out/arch/arm64/boot/Image.gz-dtb AnyKernel3_priečinok/ || cp out/arch/arm64/boot/Image AnyKernel3_priečinok/
          cd AnyKernel3_priečinok
          zip -r9 ../CreckerKernel-KSU-Next.zip *

      - name: Upload Finished Kernel Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CreckerKernel-KSU-Next-S10e
          path: CreckerKernel-KSU-Next.zip
