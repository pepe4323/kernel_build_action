# A simple action usage
name: Build Kernel (KSU-Next Fix)

on:
  workflow_dispatch:

jobs:
  Build-Kernel:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Maximize Build Space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/powershell
          sudo apt-get clean

      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential ccache flex git gnupg gperf libncurses5-dev libssl-dev libxml2-dev libxml2-utils lzop pngcrush rsync schedtool squashfs-tools xsltproc zip zlib1g-dev python3 libssl-dev curl wget llvm clang gcc-aarch64-linux-gnu lz4 unzip

      - name: Checkout Kernel Source
        run: |
          git clone --depth=1 -b main https://github.com/pepe4323/9820_kernel .
          # ^ SEM VLOŽ SVOJ REÁLNY ODKAZ NA KERNEL

      - name: Integrate KernelSU-Next v3.4.2 (Bulletproof Git Method)
        run: |
          # Natvrdo vyčistíme staré priečinky
          rm -rf drivers/kernelsu
          
          # Stiahneme presnú stabilnú verziu v3.4.2 z novej oficiálnej organizácie priamo na správne miesto
          git clone -b v3.4.2 --depth=1 https://github.com drivers/kernelsu
          
          # Presunieme samotné jadro ovládača do koreňa zložky, presne tak, ako to vyžaduje kconfig
          cd drivers/kernelsu
          cp -r kernel/* .
          cd ../..
          
          # Ošetríme duplicity a prepojíme Makefile
          sed -i '/obj-y += kernelsu\//d' drivers/Makefile
          echo "obj-y += kernelsu/" >> drivers/Makefile
          
          # Ošetríme duplicity a prepojíme Kconfig pred záverečný endmenu tag
          sed -i '/source "drivers\/kernelsu\/Kconfig"/d' drivers/Kconfig
          sed -i '/endmenu/i source "drivers/kernelsu/Kconfig"' drivers/Kconfig
          
          # Dynamicky vyhľadáme tvoj defconfig súbor v Samsung štruktúre
          CONFIG_PATH=$(find arch/arm64/configs/ -name "beyond0qlte_eur_open_defconfig" | head -n 1)
          if [ -z "$CONFIG_PATH" ]; then
            CONFIG_PATH=$(find arch/arm64/configs/ -name "*defconfig" | head -n 1)
          fi
          echo "Konfigurujem defconfig na ceste: $CONFIG_PATH"
          
          # Vynútime zápis potrebných flagov pre Android 15 / OneUI 7 root
          sed -i '/CONFIG_KSU/d' "$CONFIG_PATH"
          sed -i '/CONFIG_MODULE_SIG/d' "$CONFIG_PATH"
          echo "CONFIG_KSU=y" >> "$CONFIG_PATH"
          echo "CONFIG_KSU_NEXT=y" >> "$CONFIG_PATH"
          echo "CONFIG_MODULE_SIG=n" >> "$CONFIG_PATH"

      - name: Build Kernel Core
        run: |
          export ARCH=arm64
          export SUBARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          
          # Zistíme relatívny názov konfigurácie pre Samsung (napr. exynos/beyond0qlte_eur_open_defconfig)
          CONFIG_NAME=$(find arch/arm64/configs/ -name "beyond0qlte_eur_open_defconfig" | sed 's|arch/arm64/configs/||' | head -n 1)
          echo "Aktivujem konfiguráciu: $CONFIG_NAME"
          
          make O=out ARCH=arm64 "$CONFIG_NAME"
          make -j$(nproc --all) O=out ARCH=arm64 CC=clang CLANG_TRIPLE=aarch64-linux-gnu- CROSS_COMPILE=aarch64-linux-gnu-

      - name: Package with AnyKernel3
        run: |
          git clone --depth=1 https://github.com AnyKernel3_priečinok
          cp out/arch/arm64/boot/Image.gz-dtb AnyKernel3_priečinok/ || cp out/arch/arm64/boot/Image AnyKernel3_priečinok/
          cd AnyKernel3_priečinok
          zip -r9 ../CreckerKernel-KSU-Next.zip *

      - name: Upload Finished Kernel Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CreckerKernel-KSU-Next-S10e
          path: CreckerKernel-KSU-Next.zip
