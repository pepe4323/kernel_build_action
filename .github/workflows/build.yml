# A simple action usage
name: Build Kernel (KSU-Next Fix)

on:
  workflow_dispatch:

jobs:
  Build-Kernel:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Maximize Build Space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/powershell
          sudo apt-get clean

      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential ccache flex g++-multilib gcc-multilib git gnupg gperf lib32readline-dev lib32z1-dev liblz4-tool libncurses5-dev libsdl1.2-dev libssl-dev libxml2-dev libxml2-utils lzop pngcrush rsync schedtool squashfs-tools xsltproc zip zlib1g-dev python3 libssl-dev curl

      - name: Download Clang Toolchain
        run: |
          mkdir -p $GITHUB_WORKSPACE/clang
          cd $GITHUB_WORKSPACE/clang
          wget https://googlesource.com
          tar -xf clang-r416183b.tar.gz

      - name: Checkout Kernel Source
        run: |
          git clone --depth=1 -b oneui7 https://github.com/pepe4323/9820_kernel
          # ^ SEM VLOŽ SVOJ ODKAZ NA KERNEL (REPLÁCNI ODKAZ VYŠŠIE)

      - name: Integrate KernelSU-Next v3.4.2
        run: |
          cd kernel_src
          curl -LSs "https://githubusercontent.com" | bash -s v3.4.2
          echo "CONFIG_KSU=y" >> arch/arm64/configs/beyond0qlte_eur_open_defconfig
          echo "CONFIG_KSU_NEXT=y" >> arch/arm64/configs/beyond0qlte_eur_open_defconfig
          echo "CONFIG_MODULE_SIG=n" >> arch/arm64/configs/beyond0qlte_eur_open_defconfig

      - name: Build Kernel Core
        run: |
          cd kernel_src
          export PATH=$GITHUB_WORKSPACE/clang/bin:$PATH
          export ARCH=arm64
          export SUBARCH=arm64
          export CROSS_COMPILE=aarch64-linux-android-
          export CLANG_TRIPLE=aarch64-linux-gnu-
          make O=out ARCH=arm64 beyond0qlte_eur_open_defconfig
          make -j$(nproc --all) O=out ARCH=arm64 CC=clang

      - name: Package with AnyKernel3
        run: |
          git clone --depth=1 https://github.com AnyKernel3
          cp kernel_src/out/arch/arm64/boot/Image.gz-dtb AnyKernel3/
          cd AnyKernel3
          zip -r9 ../CreckerKernel-KSU-Next.zip *

      - name: Upload Finished Kernel Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CreckerKernel-KSU-Next-S10e
          path: CreckerKernel-KSU-Next.zip
