# A simple action usage
name: Build Kernel (KSU-Next Fix)

on:
  workflow_dispatch:

jobs:
  Build-Kernel:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Maximize Build Space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/powershell
          sudo apt-get clean

      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential ccache flex git gnupg gperf libncurses5-dev libssl-dev libxml2-dev libxml2-utils lzop pngcrush rsync schedtool squashfs-tools xsltproc zip zlib1g-dev python3 libssl-dev curl wget llvm clang gcc-aarch64-linux-gnu lz4 unzip

      - name: Checkout Kernel Source
        run: |
          git clone --depth=1 -b main https://github.com/pepe4323/9820_kernel .
          # ^ SEM VLOŽ SVOJ REÁLNY ODKAZ NA KERNEL

      - name: Integrate KernelSU-Next v3.4.2 (Native Patch Method)
        run: |
          # Vyčistíme a vytvoríme čistú cieľovú zložku pre ovládač
          rm -rf drivers/kernelsu
          mkdir -p drivers/kernelsu
          
          # Stiahneme kompletnú implementáciu priamo cez oficiálny inštalačný manažér organizácie
          curl -LSs "https://githubusercontent.com" | bash -s v3.4.2
          
          # Prečistíme staré prepojenia v Makefile, aby sme predišli chybám kompilácie
          sed -i '/obj-y += kernelsu\//d' drivers/Makefile
          echo "obj-y += kernelsu/" >> drivers/Makefile
          
          # Bezpečne integrujeme Kconfig menu pred záverečný endmenu tag
          sed -i '/source "drivers\/kernelsu\/Kconfig"/d' drivers/Kconfig
          sed -i '/endmenu/i source "drivers/kernelsu/Kconfig"' drivers/Kconfig
          
          # Vyčistíme staré a natvrdo vynútime CONFIG prepínače na konci tvojho defconfigu
          sed -i '/CONFIG_KSU/d' arch/arm64/configs/beyond0qlte_eur_open_defconfig
          sed -i '/CONFIG_MODULE_SIG/d' arch/arm64/configs/beyond0qlte_eur_open_defconfig
          echo "CONFIG_KSU=y" >> arch/arm64/configs/beyond0qlte_eur_open_defconfig
          echo "CONFIG_KSU_NEXT=y" >> arch/arm64/configs/beyond0qlte_eur_open_defconfig
          echo "CONFIG_MODULE_SIG=n" >> arch/arm64/configs/beyond0qlte_eur_open_defconfig

      - name: Build Kernel Core
        run: |
          export ARCH=arm64
          export SUBARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          make O=out ARCH=arm64 beyond0qlte_eur_open_defconfig
          make -j$(nproc --all) O=out ARCH=arm64 CC=clang CLANG_TRIPLE=aarch64-linux-gnu- CROSS_COMPILE=aarch64-linux-gnu-

      - name: Package with AnyKernel3
        run: |
          git clone --depth=1 https://github.com AnyKernel3_priečinok
          cp out/arch/arm64/boot/Image.gz-dtb AnyKernel3_priečinok/ || cp out/arch/arm64/boot/Image AnyKernel3_priečinok/
          cd AnyKernel3_priečinok
          zip -r9 ../CreckerKernel-KSU-Next.zip *

      - name: Upload Finished Kernel Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CreckerKernel-KSU-Next-S10e
          path: CreckerKernel-KSU-Next.zip
